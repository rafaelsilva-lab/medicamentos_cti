<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicamentos de Terapia Intensiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-container {
            padding: 30px 40px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .search-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-select {
            padding: 15px 20px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .clear-btn {
            padding: 15px 30px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .clear-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        .stats {
            padding: 20px 40px;
            background: #e9ecef;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .content {
            padding: 40px;
        }

        .class-section {
            margin-bottom: 40px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .class-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .class-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
        }

        .medications-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .medication-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .medication-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .medication-card.active {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .medication-commercial {
            font-size: 1.3em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .click-indicator {
            font-size: 0.8em;
            color: #667eea;
            opacity: 0.7;
        }

        .medication-generic {
            color: #667eea;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .medication-description {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e9ecef;
            color: #4a5568;
            line-height: 1.6;
            font-size: 0.95em;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .medication-card.active .medication-description {
            max-height: 500px;
            transition: max-height 0.5s ease-in;
        }

        .description-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .no-results-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-results-text {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .medications-grid {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .search-input,
            .filter-select,
            .clear-btn {
                width: 100%;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💊 Medicamentos de Terapia Intensiva</h1>
            <p>Guia completo de medicamentos utilizados em CTI • Clique nos cards para ver descrições</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="🔍 Buscar medicamento (nome comercial ou genérico)..."
                >
                <select class="filter-select" id="classFilter">
                    <option value="">Todas as classes</option>
                </select>
                <button class="clear-btn" id="clearBtn">Limpar</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalMeds">0</div>
                <div class="stat-label">Medicamentos</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalClasses">0</div>
                <div class="stat-label">Classes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="visibleMeds">0</div>
                <div class="stat-label">Exibidos</div>
            </div>
        </div>

        <div class="content" id="content">
            <!-- Content will be generated by JavaScript -->
        </div>

        <div class="no-results hidden" id="noResults">
            <div class="no-results-icon">🔍</div>
            <div class="no-results-text">Nenhum medicamento encontrado</div>
            <p>Tente buscar por outro termo ou selecione uma classe diferente</p>
        </div>
    </div>

        const searchInput = document.getElementById('searchInput');
        const classFilter = document.getElementById('classFilter');
        const clearBtn = document.getElementById('clearBtn');
        const content = document.getElementById('content');
        const noResults = document.getElementById('noResults');
        const totalMeds = document.getElementById('totalMeds');
        const totalClasses = document.getElementById('totalClasses');
        const visibleMeds = document.getElementById('visibleMeds');

        function initializeApp() {
            populateClassFilter();
            renderMedications();
            updateStats();
        }

        function populateClassFilter() {
            const classes = Object.keys(medications).sort();
            classes.forEach(className => {
                const option = document.createElement('option');
                option.value = className;
                option.textContent = className;
                classFilter.appendChild(option);
            });
        }

        function renderMedications(searchTerm = '', filterClass = '') {
            content.innerHTML = '';
            let visibleCount = 0;
            let hasResults = false;

            Object.keys(medications).sort().forEach((className, index) => {
                if (filterClass && className !== filterClass) return;

                const meds = medications[className].filter(med => {
                    if (!searchTerm) return true;
                    const term = searchTerm.toLowerCase();
                    return med.commercial.toLowerCase().includes(term) || 
                           med.generic.toLowerCase().includes(term);
                });

                if (meds.length === 0) return;

                hasResults = true;
                const section = document.createElement('div');
                section.className = 'class-section';

                const title = document.createElement('div');
                title.className = 'class-title';
                
                const icon = document.createElement('div');
                icon.className = 'class-icon';
                icon.textContent = (index + 1);
                
                title.appendChild(icon);
                title.appendChild(document.createTextNode(className));
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'medications-grid';

                meds.forEach(med => {
                    visibleCount++;
                    const card = document.createElement('div');
                    card.className = 'medication-card';
                    
                    const commercial = document.createElement('div');
                    commercial.className = 'medication-commercial';
                    commercial.innerHTML = `${med.commercial} <span class="click-indicator">ⓘ</span>`;
                    
                    const generic = document.createElement('div');
                    generic.className = 'medication-generic';
                    generic.textContent = med.generic;
                    
                    const description = document.createElement('div');
                    description.className = 'medication-description';
                    description.innerHTML = `<div class="description-title">Descrição e Uso:</div>${med.description}`;
                    
                    card.appendChild(commercial);
                    card.appendChild(generic);
                    card.appendChild(description);
                    
                    card.addEventListener('click', function() {
                        const wasActive = this.classList.contains('active');
                        
                        // Remove active class from all cards
                        document.querySelectorAll('.medication-card').forEach(c => {
                            c.classList.remove('active');
                        });
                        
                        // Toggle active class on clicked card
                        if (!wasActive) {
                            this.classList.add('active');
                        }
                    });
                    
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                content.appendChild(section);
            });

            if (!hasResults) {
                content.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                content.classList.remove('hidden');
                noResults.classList.add('hidden');
            }

            visibleMeds.textContent = visibleCount;
        }

        function updateStats() {
            let total = 0;
            Object.values(medications).forEach(meds => {
                total += meds.length;
            });
            totalMeds.textContent = total;
            totalClasses.textContent = Object.keys(medications).length;
        }

        searchInput.addEventListener('input', (e) => {
            renderMedications(e.target.value, classFilter.value);
        });

        classFilter.addEventListener('change', (e) => {
            renderMedications(searchInput.value, e.target.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            classFilter.value = '';
            renderMedications();
            // Remove active class from all cards
            document.querySelectorAll('.medication-card').forEach(c => {
                c.classList.remove('active');
            });
        });

        initializeApp();
    </script>
